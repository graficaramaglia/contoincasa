<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ContoInCasa</title>
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17222e" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ContoInCasa">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
body{margin:0;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: app a colonna singola, larghezza da telefono, header fisso con mese, schede per casa, pulsante + in basso */
:root{
  --bg:#f6f2ed; --surface:#ffffff; --sunk:#ede6de; --ink:#1c2a38; --muted:#66707a; --line:#e2d9cf;
  --napoli:#d2621c; --napoli-soft:#fbe6d6; --colla:#1f4f78; --colla-soft:#dde8f2;
  --ok:#2a7d52; --warn:#b06f0c; --warn-soft:#fbecd0; --danger:#b8352a; --danger-soft:#f8dcd8;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --casa:var(--napoli); --casa-soft:var(--napoli-soft);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1720; --surface:#17222e; --sunk:#1f2c3a; --ink:#eef1f4; --muted:#9aa6b2; --line:#2b3a4a;
  --napoli:#f19a58; --napoli-soft:#3a2516; --colla:#7db6ea; --colla-soft:#1a2e44;
  --ok:#6cc99a; --warn:#eab25a; --warn-soft:#3a2c12; --danger:#f07c6f; --danger-soft:#3c1f1c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1720; --surface:#17222e; --sunk:#1f2c3a; --ink:#eef1f4; --muted:#9aa6b2; --line:#2b3a4a;
  --napoli:#f19a58; --napoli-soft:#3a2516; --colla:#7db6ea; --colla-soft:#1a2e44;
  --ok:#6cc99a; --warn:#eab25a; --warn-soft:#3a2c12; --danger:#f07c6f; --danger-soft:#3c1f1c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--casa);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:grid;gap:10px;padding-block:12px 10px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:10px}
.logo img{flex:none;display:block;width:40px;height:auto}
.brand h1{margin:0;font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.01em}
.brand h1 span{color:var(--casa)}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.sync.local i{background:var(--warn)}
.month{display:flex;align-items:center;justify-content:space-between;gap:8px}
.month b{font-family:var(--display);font-weight:600;font-size:17px;text-transform:capitalize}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:18px}
.tabs{display:grid;grid-template-columns:1fr 1fr 1fr;background:var(--sunk);border-radius:12px;padding:3px;gap:3px}
.tabs button{border:0;background:transparent;padding:9px 4px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
.tabs .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}

main{padding-block:16px 120px;display:grid;gap:22px}
.note{background:var(--warn-soft);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:13.5px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.note button{border:1px solid var(--warn);color:var(--warn);background:transparent;border-radius:8px;padding:5px 10px;font-size:13px;font-weight:600}

.hero{background:var(--casa);color:#fff;border-radius:18px;padding:18px;display:grid;gap:14px}
.hero .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;opacity:.85}
.hero .big{font-family:var(--display);font-weight:800;font-size:38px;line-height:1;letter-spacing:-.02em}
.hero .row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid rgb(255 255 255 / .25);padding-top:12px}
.hero .row div{min-width:0}
.hero .row small{display:block;font-size:11.5px;opacity:.85}
.hero .row strong{font-size:15px;font-weight:700}
:root[data-theme="dark"] .hero,.dark-hero{color:#10161d}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hero{color:#10161d}
  :root:not([data-theme="light"]) .hero .row{border-color:rgb(0 0 0 / .2)}}

section h2{margin:0 0 8px;font-family:var(--display);font-weight:600;font-size:17px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
section h2 small{font-family:var(--body);font-weight:500;font-size:13px;color:var(--muted)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item{display:grid;grid-template-columns:46px 1fr auto auto;gap:12px;align-items:center;padding:11px 12px;border-top:1px solid var(--line);width:100%;text-align:left;background:transparent;border-left:0;border-right:0;border-bottom:0}
.item:first-child{border-top:0}
.item.v{grid-template-columns:46px 1fr auto}
.date{width:46px;height:46px;border-radius:10px;background:var(--casa-soft);color:var(--casa);display:grid;place-items:center;align-content:center;line-height:1.05}
.date b{font-size:17px;font-weight:700}
.date small{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.item .t{min-width:0}
.item .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:700;text-align:right;white-space:nowrap}
.pill{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:1px 7px;margin-left:4px;vertical-align:1px}
.pill.late{background:var(--danger-soft);color:var(--danger)}
.pill.soon{background:var(--warn-soft);color:var(--warn)}
.pill.ex{background:var(--sunk);color:var(--muted)}
.check{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:transparent;display:grid;place-items:center;font-size:16px;color:transparent}
.check[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.item.paid .t b,.item.paid .amt{color:var(--muted)}
.item.paid .amt{text-decoration:line-through}
.empty{padding:18px 14px;color:var(--muted);font-size:14px;text-align:center}
.add{margin-top:8px;width:100%;border:1.5px dashed var(--line);background:transparent;border-radius:12px;padding:11px;font-weight:600;color:var(--casa)}

.fab{position:fixed;right:calc(max(16px,env(safe-area-inset-right,0px)) + 4px);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--casa);color:#fff;border:0;border-radius:16px;padding:14px 20px;font-weight:700;font-size:15px;box-shadow:0 6px 18px rgb(0 0 0 / .22)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .fab{color:#10161d}}
:root[data-theme="dark"] .fab{color:#10161d}

/* Riepilogo */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.card .lbl{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.card .v{font-family:var(--display);font-weight:800;font-size:24px;margin-top:4px}
.card .sub{font-size:12.5px;color:var(--muted)}
.tot{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.tot .v{font-size:30px}
.split{height:10px;border-radius:6px;overflow:hidden;display:flex;background:var(--sunk);margin-top:10px}
.split span{display:block;height:100%}
.cats{display:grid;gap:10px}
.cat{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;font-size:13.5px}
.cat .bar{height:10px;border-radius:5px;background:var(--sunk);overflow:hidden;display:flex}
.cat .bar span{display:block;height:100%}
.months{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:end;height:170px;padding-top:6px}
.mcol{display:grid;grid-template-rows:auto 1fr auto;height:100%;gap:4px;text-align:center;min-width:0}
.mcol small{font-size:11px;color:var(--muted)}
.mcol .val{font-size:11px;font-weight:600}
.stack{display:flex;flex-direction:column-reverse;justify-content:flex-start;align-self:end;border-radius:6px 6px 2px 2px;overflow:hidden;width:70%;margin:0 auto;min-height:2px}
.stack span{display:block}
.mcol.cur .val,.mcol.cur small{color:var(--ink);font-weight:700}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-top:10px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.ghost{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;font-weight:600}

/* Foglio di inserimento */
.scrim{position:fixed;inset:0;background:rgb(10 16 22 / .45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-height:92vh;overflow-y:auto;display:grid;gap:14px}
.sheet h3{margin:0;font-family:var(--display);font-weight:800;font-size:20px}
.f{display:grid;gap:5px}
.f label{font-size:12.5px;font-weight:600;color:var(--muted)}
.f input,.f select{width:100%;font:inherit;font-size:16px;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg button{border:1.5px solid var(--line);background:transparent;border-radius:10px;padding:10px;font-weight:600}
.seg button[aria-pressed="true"]{border-color:var(--casa);background:var(--casa-soft);color:var(--casa)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions .primary{flex:1;background:var(--casa);color:#fff;border:0;border-radius:12px;padding:13px;font-weight:700;font-size:16px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .actions .primary{color:#10161d}}
:root[data-theme="dark"] .actions .primary{color:#10161d}
.actions .sec{background:transparent;border:1px solid var(--line);border-radius:12px;padding:13px 16px;font-weight:600}
.actions .del{background:transparent;border:1px solid var(--danger);color:var(--danger);border-radius:12px;padding:13px 16px;font-weight:600}
.actions .del.armed{background:var(--danger);color:#fff}
.err{color:var(--danger);font-size:13px;min-height:1em}
.login{display:grid;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;margin-top:8px}
.login h2{margin:0;font-family:var(--display);font-weight:800;font-size:22px}
.login p{margin:0;color:var(--muted)}
.login .primary{background:var(--napoli);color:#fff;border:0;border-radius:12px;padding:13px;font-weight:700;font-size:16px}
.who{text-align:center;font-size:13px;color:var(--muted)}
.who button{border:0;background:none;color:var(--colla);font-weight:600;text-decoration:underline;padding:4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:30}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
</style>

</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand"><div class="logo"><img src="icons/logo.png" width="40" height="37" alt=""><h1>Conto<span>In</span>Casa</h1></div><div class="sync" id="sync"><i></i><span>Collegamento…</span></div></div>
    <div class="month">
      <button class="iconbtn" id="prev" aria-label="Mese precedente">‹</button>
      <b id="mlabel" class="num"></b>
      <button class="iconbtn" id="next" aria-label="Mese successivo">›</button>
    </div>
    <div class="tabs" role="tablist" id="tabs">
      <button role="tab" data-tab="napoli"><span class="dot" style="background:var(--napoli)"></span>Casa Napoli</button>
      <button role="tab" data-tab="colla"><span class="dot" style="background:var(--colla)"></span>Casa Colle</button>
      <button role="tab" data-tab="riepilogo">Riepilogo</button>
    </div>
  </div>
</header>
<main class="wrap" id="main"><div class="empty">Carico i conti…</div></main>
<button class="fab" id="fab" hidden>+ Spesa</button>
<div id="sheetRoot"></div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
(function(){
const MESI=['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
const MESI_B=['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
const CASE={napoli:{nome:'Casa Napoli',sub:'di proprietà'},colla:{nome:'Casa Colle',sub:'in affitto'}};
const CAT_FISSE=['Mutuo','Affitto','Acqua','Luce e gas','Condominio','Abbonamenti','Assicurazione','Tasse','Altro'];
const CAT_VAR=['Spesa','Benzina','Farmacia','Casa e manutenzione','Ristoranti','Svago','Abbigliamento','Altro'];
const RIC={mensile:1,bimestrale:2,trimestrale:3,semestrale:6,annuale:12};
const CAT_COL=['#d2621c','#2f6ea5','#e0a63a','#5aa8e6','#7a8f3c','#a0476a','#5a8f99','#8a6dd6','#7f8c55','#9aa5b1'];
const eur=new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'});
const eur0=new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR',maximumFractionDigits:0});
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const curYM=()=>today().slice(0,7);
const ymAdd=(ym,k)=>{let [y,m]=ym.split('-').map(Number);m+=k;while(m<1){m+=12;y--}while(m>12){m-=12;y++}return y+'-'+pad(m)};
const daysIn=ym=>{const [y,m]=ym.split('-').map(Number);return new Date(y,m,0).getDate()};
const parseAmt=v=>{const n=parseFloat(String(v).replace(/\s|€/g,'').replace(/\./g,(m,i,s)=>s.includes(',')?'':m).replace(',','.'));return isFinite(n)?Math.round(n*100)/100:NaN};

const S={fisse:[],pag:{},mov:[],ym:curYM(),tab:'napoli',loaded:{},mode:null,stale:false};
try{const t=localStorage.getItem('cic-tab');if(t&&(t in CASE||t==='riepilogo'))S.tab=t}catch(e){}

/* ---------- archivio: condiviso (cloud) o solo su questo dispositivo ---------- */
const COLS=['fisse','pagamenti','movimenti'];
function localStore(){
  const mem={},subs={};
  const load=c=>{try{return JSON.parse(localStorage.getItem('cic-'+c)||'{}')}catch(e){return{}}};
  const save=c=>{try{localStorage.setItem('cic-'+c,JSON.stringify(mem[c]))}catch(e){}};
  const emit=c=>subs[c]&&subs[c](Object.entries(mem[c]).map(([id,d])=>({id,...d})));
  COLS.forEach(c=>mem[c]=load(c));
  return{
    subscribe(c,cb){subs[c]=cb;setTimeout(()=>emit(c),0)},
    async set(c,id,d){mem[c][id]=d;save(c);emit(c)},
    async del(c,id){delete mem[c][id];save(c);emit(c)},
    newId(c){return c.slice(0,3)+'-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
  };
}
function sbStore(sb){
  const loaders={};
  const rc=c=>{try{return JSON.parse(localStorage.getItem('cic-cache-'+c)||'null')}catch(e){return null}};
  const wc=(c,d)=>{try{localStorage.setItem('cic-cache-'+c,JSON.stringify(d))}catch(e){}};
  return{
    subscribe(c,cb,err){
      const cached=rc(c);if(cached)cb(cached,{fromCache:true});
      let failed=false;
      loaders[c]=async()=>{
        const{data,error}=await sb.from(c).select('*');
        if(error){if(!failed){failed=true;err&&err(error)}return}
        failed=false;wc(c,data);cb(data,{fromCache:false});
      };
      loaders[c]();
      sb.channel('cic-'+c).on('postgres_changes',{event:'*',schema:'public',table:c},()=>loaders[c]()).subscribe();
    },
    async set(c,id,d){const{error}=await sb.from(c).upsert({id,...d});if(error)throw error;await loaders[c]?.()},
    async del(c,id){const{error}=await sb.from(c).delete().eq('id',id);if(error)throw error;await loaders[c]?.()},
    newId(){return (crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2))},
    reloadAll(){Object.values(loaders).forEach(f=>f())}
  };
}
let store,sb=null,userEmail='';

function onData(c,rows,meta){
  if(c==='fisse')S.fisse=rows;
  else if(c==='movimenti')S.mov=rows;
  else{const m={};rows.forEach(r=>m[r.id]=r);S.pag=m}
  if(!meta||!meta.fromCache)S.loaded[c]=true;
  if(COLS.every(k=>S.loaded[k]))S.stale=false;
  render();
}
function start(session){
  userEmail=session?.user?.email||'';
  S.mode='cloud';S.login=false;
  store=sbStore(sb);
  const timer=setTimeout(()=>{if(!COLS.every(k=>S.loaded[k])){S.stale=true;render()}},10000);
  COLS.forEach(c=>store.subscribe(c,(rows,meta)=>{onData(c,rows,meta);if(COLS.every(k=>S.loaded[k]))clearTimeout(timer)},e=>{S.loaded[c]=true;S.stale=true;render()}));
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&store.reloadAll)store.reloadAll()});
  addEventListener('online',()=>store.reloadAll&&store.reloadAll());
  render();
}
async function boot(){
  const cfg=window.CONTOINCASA||{};
  if(!cfg.supabaseUrl||!cfg.supabaseKey||!window.supabase){
    S.mode='local';store=localStore();
    COLS.forEach(c=>store.subscribe(c,(rows)=>onData(c,rows)));
    toast(window.supabase?'Manca la configurazione: i dati restano su questo telefono':'Sei offline');
    return;
  }
  sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseKey,{auth:{persistSession:true,autoRefreshToken:true}});
  const{data}=await sb.auth.getSession();
  if(data.session)start(data.session);else{S.login=true;render()}
}
function viewLogin(){
  return`<form class="login" id="loginForm" novalidate>
    <h2>Accedi</h2>
    <p>Usa l'email e la password che hai creato per ContoInCasa. Tu e tua moglie avete ognuno il vostro accesso e vedete gli stessi conti.</p>
    <div class="f"><label for="l-email">Email</label><input id="l-email" type="email" autocomplete="username" inputmode="email"></div>
    <div class="f"><label for="l-pass">Password</label><input id="l-pass" type="password" autocomplete="current-password"></div>
    <div class="err" id="l-err"></div>
    <button class="primary" type="submit">Entra</button>
  </form>`;
}
async function doLogin(){
  const email=$('#l-email').value.trim(),password=$('#l-pass').value;const err=$('#l-err');
  if(!email||!password){err.textContent='Scrivi email e password.';return}
  err.textContent='Accesso in corso…';
  const{data,error}=await sb.auth.signInWithPassword({email,password});
  if(error){err.textContent=error.message&&/invalid/i.test(error.message)?'Email o password non corretti.':'Accesso non riuscito. Controlla la connessione e riprova.';return}
  start(data.session);
}
async function logout(){await sb.auth.signOut();location.reload()}

/* ---------- calcoli ---------- */
function dueIn(f,ym){const m=+ym.slice(5);const st=RIC[f.ricorrenza]||1;const start=+f.meseInizio||1;return(((m-start)%st)+st)%st===0}
function scad(f,ym){return ym+'-'+pad(Math.min(+f.giorno||1,daysIn(ym)))}
function fisseMese(casa,ym){
  return S.fisse.filter(f=>(!casa||f.casa===casa)&&dueIn(f,ym)).map(f=>{
    const p=S.pag[f.id+'__'+ym];const d=scad(f,ym);const t=today();
    const diff=(new Date(d)-new Date(t))/864e5;
    const stato=p?'pagata':d<t?'scaduta':diff<=7?'presto':'attesa';
    return{...f,scadenza:d,pagata:!!p,stato};
  }).sort((a,b)=>a.scadenza.localeCompare(b.scadenza)||a.nome.localeCompare(b.nome));
}
function movMese(casa,ym){return S.mov.filter(m=>(!casa||m.casa===casa)&&String(m.data).startsWith(ym)).sort((a,b)=>b.data.localeCompare(a.data))}
function totali(casa,ym){
  const f=fisseMese(casa,ym),v=movMese(casa,ym);
  const tf=f.reduce((s,x)=>s+(+x.importo||0),0),pagato=f.filter(x=>x.pagata).reduce((s,x)=>s+(+x.importo||0),0);
  const tv=v.reduce((s,x)=>s+(+x.importo||0),0);
  return{f,v,tf,tv,pagato,daPagare:tf-pagato,tot:tf+tv};
}

/* ---------- interfaccia ---------- */
function setCasaColors(){
  const k=S.tab==='colla'?'colla':'napoli';
  document.documentElement.style.setProperty('--casa',`var(--${k})`);
  document.documentElement.style.setProperty('--casa-soft',`var(--${k}-soft)`);
}
function ymLabel(ym){return MESI[+ym.slice(5)-1]+' '+ym.slice(0,4)}
function render(){
  setCasaColors();
  $('#mlabel').textContent=ymLabel(S.ym);
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===S.tab));
  const sy=$('#sync');
  sy.className='sync'+(S.mode==='local'?' local':'');
  sy.querySelector('span').textContent=S.mode===null?'Collegamento…':S.mode==='cloud'?(S.stale||!navigator.onLine?'Offline · ultimi dati salvati':'Condiviso'):'Solo su questo dispositivo';
  if(S.login){$('#fab').hidden=true;$('#tabs').hidden=true;$('#main').innerHTML=viewLogin();sy.querySelector('span').textContent='Non collegato';return}
  $('#tabs').hidden=false;
  $('#fab').hidden=!(S.tab in CASE)||S.mode===null;
  if(!COLS.every(k=>S.loaded[k])&&!S.stale){$('#main').innerHTML='<div class="empty">Carico i conti…</div>';return}
  $('#main').innerHTML=(exampleNote())+(S.tab==='riepilogo'?viewRiepilogo():viewCasa(S.tab));
}
function exampleNote(){
  const n=S.fisse.filter(f=>f.esempio).length+S.mov.filter(m=>m.esempio).length;
  if(!n)return'';
  return`<div class="note"><span>Le voci segnate <span class="pill ex">esempio</span> servono a farti vedere l'app. Toccale per inserire i tuoi importi, oppure eliminale tutte.</span><button data-act="clearEx" id="clearEx">${S.armClear?'Tocca di nuovo per confermare':'Elimina esempi'}</button></div>`;
}
function viewCasa(casa){
  const t=totali(casa,S.ym);const C=CASE[casa];
  const mb=MESI_B[+S.ym.slice(5)-1];
  const fRows=t.f.map(f=>{
    const pill=f.stato==='scaduta'?'<span class="pill late">scaduta</span>':f.stato==='presto'?'<span class="pill soon">in scadenza</span>':'';
    return`<div class="item ${f.pagata?'paid':''}">
      <div class="date num"><b>${+f.scadenza.slice(8)}</b><small>${mb}</small></div>
      <button class="t" data-act="editF" data-id="${esc(f.id)}" style="border:0;background:none;padding:0;text-align:left"><b>${esc(f.nome)}${f.esempio?'<span class="pill ex">esempio</span>':''}${pill}</b><small>${esc(f.categoria)} · ${esc(f.ricorrenza)}</small></button>
      <div class="amt num">${eur.format(+f.importo||0)}</div>
      <button class="check" data-act="pay" data-id="${esc(f.id)}" aria-pressed="${f.pagata}" aria-label="${f.pagata?'Segna come da pagare':'Segna come pagata'}">✓</button>
    </div>`}).join('');
  const vRows=t.v.map(m=>`<button class="item v" data-act="editM" data-id="${esc(m.id)}">
      <div class="date num"><b>${+m.data.slice(8)}</b><small>${MESI_B[+m.data.slice(5,7)-1]}</small></div>
      <div class="t"><b>${esc(m.descrizione||m.categoria)}${m.esempio?'<span class="pill ex">esempio</span>':''}</b><small>${esc(m.categoria)}</small></div>
      <div class="amt num">${eur.format(+m.importo||0)}</div></button>`).join('');
  return`
  <div class="hero">
    <div><div class="lbl">${C.nome} · ${C.sub} · totale di ${MESI[+S.ym.slice(5)-1]}</div><div class="big num">${eur.format(t.tot)}</div></div>
    <div class="row num">
      <div><small>Spese fisse</small><strong>${eur0.format(t.tf)}</strong></div>
      <div><small>Da pagare</small><strong>${eur0.format(t.daPagare)}</strong></div>
      <div><small>Variabili</small><strong>${eur0.format(t.tv)}</strong></div>
    </div>
  </div>
  <section><h2>Spese fisse <small>${t.f.filter(x=>x.pagata).length} di ${t.f.length} pagate</small></h2>
    <div class="list">${fRows||`<div class="empty">Nessuna scadenza a ${MESI[+S.ym.slice(5)-1]} per ${C.nome}.</div>`}</div>
    <button class="add" data-act="newF">+ Aggiungi spesa fissa</button>
  </section>
  <section><h2>Spese del mese <small>${t.v.length} movimenti</small></h2>
    <div class="list">${vRows||`<div class="empty">Nessuna spesa registrata. Tocca <b>+ Spesa</b> per aggiungere benzina, spesa e altro.</div>`}</div>
  </section>`;
}
function viewRiepilogo(){
  const ym=S.ym,a=totali('napoli',ym),b=totali('colla',ym),tot=a.tot+b.tot;
  // categorie del mese (entrambe le case)
  const cats={};
  [...a.f,...b.f].forEach(f=>cats[f.categoria]=(cats[f.categoria]||0)+(+f.importo||0));
  [...a.v,...b.v].forEach(m=>cats[m.categoria]=(cats[m.categoria]||0)+(+m.importo||0));
  const catList=Object.entries(cats).filter(([,v])=>v>0).sort((x,y)=>y[1]-x[1]);
  const cmax=catList.length?catList[0][1]:1;
  const catHtml=catList.map(([k,v],i)=>`<div class="cat"><span>${esc(k)}</span><div class="bar"><span style="width:${(v/cmax*100).toFixed(1)}%;background:${CAT_COL[i%CAT_COL.length]}"></span></div><b class="num">${eur0.format(v)}</b></div>`).join('')||'<div class="empty">Nessuna spesa questo mese.</div>';
  // ultimi 6 mesi
  const ms=[...Array(6)].map((_,i)=>ymAdd(ym,i-5));
  const data=ms.map(m=>({m,n:totali('napoli',m).tot,c:totali('colla',m).tot}));
  const mx=Math.max(1,...data.map(d=>d.n+d.c));
  const monthsHtml=data.map(d=>`<div class="mcol ${d.m===ym?'cur':''}"><span class="val num">${d.n+d.c?eur0.format(d.n+d.c).replace(/\s?€/,'')+'€':'–'}</span>
     <div class="stack" style="height:${((d.n+d.c)/mx*100).toFixed(1)}%"><span style="height:${d.n+d.c?(d.n/(d.n+d.c)*100):0}%;background:var(--napoli)"></span><span style="height:${d.n+d.c?(d.c/(d.n+d.c)*100):0}%;background:var(--colla)"></span></div>
     <small>${MESI_B[+d.m.slice(5)-1]}</small></div>`).join('');
  const pa=tot?a.tot/tot*100:50;
  const daPagare=a.daPagare+b.daPagare;
  return`
  <div class="card"><div class="tot"><div><div class="lbl">Totale ${MESI[+ym.slice(5)-1]} · entrambe le case</div><div class="v num">${eur.format(tot)}</div></div>
    <div class="sub num">Ancora da pagare: <b style="color:${daPagare>0?'var(--warn)':'var(--ok)'}">${eur.format(daPagare)}</b></div></div>
    <div class="split"><span style="width:${pa}%;background:var(--napoli)"></span><span style="width:${100-pa}%;background:var(--colla)"></span></div>
  </div>
  <div class="duo">
    ${[['napoli',a],['colla',b]].map(([k,t])=>`<div class="card"><div class="lbl"><span class="dot" style="width:8px;height:8px;border-radius:50%;background:var(--${k})"></span>${CASE[k].nome}</div>
      <div class="v num">${eur0.format(t.tot)}</div><div class="sub num">Fisse ${eur0.format(t.tf)}<br>Variabili ${eur0.format(t.tv)}</div></div>`).join('')}
  </div>
  <section><h2>Per categoria</h2><div class="card cats">${catHtml}</div></section>
  <section><h2>Ultimi 6 mesi</h2><div class="card"><div class="months">${monthsHtml}</div>
    <div class="legend"><span><i style="background:var(--napoli)"></i>Casa Napoli</span><span><i style="background:var(--colla)"></i>Casa Colle</span></div></div></section>
  <button class="ghost" data-act="csv">Esporta ${MESI[+ym.slice(5)-1]} in Excel (CSV)</button>
  ${userEmail?`<div class="who">Collegato come ${esc(userEmail)} · <button data-act="logout">Esci</button></div>`:''}`;
}

/* ---------- foglio inserimento ---------- */
let sheet=null;
function opts(list,sel){return list.map(o=>`<option ${o===sel?'selected':''}>${esc(o)}</option>`).join('')}
function openSheet(kind,rec){
  const isF=kind==='F';const casa=rec?.casa||(S.tab in CASE?S.tab:'napoli');
  sheet={kind,id:rec?.id||null,casa,armed:false};
  const ric=Object.keys(RIC);
  const body=isF?`
    <div class="f"><label for="s-nome">Nome</label><input id="s-nome" value="${esc(rec?.nome||'')}" placeholder="Es. Bolletta luce Enel" autocomplete="off"></div>
    <div class="f2"><div class="f"><label for="s-cat">Categoria</label><select id="s-cat">${opts(CAT_FISSE,rec?.categoria||'Luce e gas')}</select></div>
      <div class="f"><label for="s-imp">Importo €</label><input id="s-imp" inputmode="decimal" value="${rec?String(rec.importo).replace('.',','):''}" placeholder="0,00"></div></div>
    <div class="f2"><div class="f"><label for="s-gg">Giorno di scadenza</label><input id="s-gg" type="number" min="1" max="31" inputmode="numeric" value="${esc(rec?.giorno||'')}" placeholder="1–31"></div>
      <div class="f"><label for="s-ric">Ogni quanto</label><select id="s-ric">${opts(ric,rec?.ricorrenza||'mensile')}</select></div></div>
    <div class="f" id="startWrap"><label for="s-start">Primo mese di scadenza</label><select id="s-start">${MESI.map((m,i)=>`<option value="${i+1}" ${(+(rec?.meseInizio||+S.ym.slice(5)))===i+1?'selected':''}>${m}</option>`).join('')}</select></div>`
  :`
    <div class="f2"><div class="f"><label for="s-imp">Importo €</label><input id="s-imp" inputmode="decimal" value="${rec?String(rec.importo).replace('.',','):''}" placeholder="0,00"></div>
      <div class="f"><label for="s-data">Data</label><input id="s-data" type="date" value="${esc(rec?.data||(S.ym===curYM()?today():S.ym+'-01'))}"></div></div>
    <div class="f"><label for="s-cat">Categoria</label><select id="s-cat">${opts(CAT_VAR,rec?.categoria||'Spesa')}</select></div>
    <div class="f"><label for="s-desc">Descrizione (facoltativa)</label><input id="s-desc" value="${esc(rec?.descrizione||'')}" placeholder="Es. Conad, pieno Q8…" autocomplete="off"></div>`;
  $('#sheetRoot').innerHTML=`<div class="scrim" data-act="close"><form class="sheet" id="sheetForm" novalidate>
    <h3>${rec?'Modifica':'Nuova'} ${isF?'spesa fissa':'spesa'}</h3>
    <div class="seg" role="group" aria-label="Casa">${Object.keys(CASE).map(k=>`<button type="button" data-act="casa" data-casa="${k}" aria-pressed="${k===casa}">${CASE[k].nome}</button>`).join('')}</div>
    ${body}
    <div class="err" id="s-err"></div>
    <div class="actions"><button type="submit" class="primary">Salva</button><button type="button" class="sec" data-act="close">Annulla</button>${rec?'<button type="button" class="del" data-act="del">Elimina</button>':''}</div>
  </form></div>`;
  syncStart();
  setTimeout(()=>{const el=$(isF?'#s-nome':'#s-imp');el&&!rec&&el.focus()},50);
}
function syncStart(){const r=$('#s-ric'),w=$('#startWrap');if(r&&w)w.hidden=r.value==='mensile'}
function closeSheet(){sheet=null;$('#sheetRoot').innerHTML=''}
async function saveSheet(){
  const err=$('#s-err');const imp=parseAmt($('#s-imp').value);
  if(!(imp>=0)){err.textContent='Scrivi un importo valido, ad esempio 45,90.';return}
  let col,data;
  if(sheet.kind==='F'){
    const nome=$('#s-nome').value.trim();const gg=parseInt($('#s-gg').value,10);
    if(!nome){err.textContent='Dai un nome alla spesa, ad esempio "Bolletta acqua".';return}
    if(!(gg>=1&&gg<=31)){err.textContent='Il giorno di scadenza va da 1 a 31.';return}
    col='fisse';data={casa:sheet.casa,nome,categoria:$('#s-cat').value,importo:imp,giorno:gg,ricorrenza:$('#s-ric').value,meseInizio:+$('#s-start').value};
  }else{
    const d=$('#s-data').value;if(!/^\d{4}-\d{2}-\d{2}$/.test(d)){err.textContent='Scegli la data della spesa.';return}
    col='movimenti';data={casa:sheet.casa,data:d,categoria:$('#s-cat').value,descrizione:$('#s-desc').value.trim(),importo:imp};
  }
  const id=sheet.id||store.newId(col);const nuovo=!sheet.id;
  try{await store.set(col,id,data);closeSheet();toast(nuovo?'Spesa aggiunta':'Modifiche salvate');
    if(col==='movimenti'&&!data.data.startsWith(S.ym)){S.ym=data.data.slice(0,7);render()}}
  catch(e){err.textContent=navigator.onLine?'Non sono riuscito a salvare. Riprova tra poco.':'Sei offline: collegati a internet e tocca di nuovo Salva.'}
}
async function delSheet(btn){
  if(!sheet.armed){sheet.armed=true;btn.classList.add('armed');btn.textContent='Conferma';return}
  const col=sheet.kind==='F'?'fisse':'movimenti';
  try{await store.del(col,sheet.id);closeSheet();toast('Eliminata')}catch(e){$('#s-err').textContent='Non sono riuscito a eliminarla. Riprova.'}
}

/* ---------- azioni ---------- */
let busy={};
async function togglePay(id){
  const key=id+'__'+S.ym;if(busy[key])return;busy[key]=true;
  try{ if(S.pag[key])await store.del('pagamenti',key);
       else{const f=S.fisse.find(x=>x.id===id);await store.set('pagamenti',key,{fissaId:id,mese:S.ym,importo:+f.importo||0,pagataIl:today()})} }
  catch(e){toast('Non riesco a salvare il pagamento')}
  busy[key]=false;
}
async function clearExamples(){
  if(!S.armClear){S.armClear=true;render();return}
  S.armClear=false;
  const fx=S.fisse.filter(f=>f.esempio),mx=S.mov.filter(m=>m.esempio);
  for(const f of fx){await store.del('fisse',f.id)}
  for(const m of mx){await store.del('movimenti',m.id)}
  for(const k of Object.keys(S.pag)){if(fx.some(f=>k.startsWith(f.id+'__')))await store.del('pagamenti',k)}
  toast('Esempi eliminati');
}
async function exportCSV(){
  const ym=S.ym;const rows=[['Casa','Tipo','Data','Voce','Categoria','Importo','Stato']];
  for(const casa of Object.keys(CASE)){
    fisseMese(casa,ym).forEach(f=>rows.push([CASE[casa].nome,'Fissa',f.scadenza,f.nome,f.categoria,(+f.importo).toFixed(2).replace('.',','),f.pagata?'Pagata':'Da pagare']));
    movMese(casa,ym).forEach(m=>rows.push([CASE[casa].nome,'Variabile',m.data,m.descrizione||m.categoria,m.categoria,(+m.importo).toFixed(2).replace('.',','),'']));
  }
  const csv='﻿'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(';')).join('\r\n');
  const name=`ContoInCasa-${ym}.csv`;const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  try{const file=new File([blob],name,{type:'text/csv'});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return}}catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)
}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2200)}

document.addEventListener('click',e=>{
  const tab=e.target.closest('#tabs button');
  if(tab){S.tab=tab.dataset.tab;S.armClear=false;try{localStorage.setItem('cic-tab',S.tab)}catch(_){}render();window.scrollTo(0,0);return}
  if(e.target.closest('#prev')){S.ym=ymAdd(S.ym,-1);render();return}
  if(e.target.closest('#next')){S.ym=ymAdd(S.ym,1);render();return}
  if(e.target.closest('#fab')){openSheet('M');return}
  const a=e.target.closest('[data-act]');if(!a)return;
  const act=a.dataset.act;
  if(act==='close'&&e.target!==a)return; // clic dentro il foglio
  if(act==='close')closeSheet();
  else if(act==='pay')togglePay(a.dataset.id);
  else if(act==='editF')openSheet('F',S.fisse.find(x=>x.id===a.dataset.id));
  else if(act==='editM')openSheet('M',S.mov.find(x=>x.id===a.dataset.id));
  else if(act==='newF')openSheet('F');
  else if(act==='casa'){sheet.casa=a.dataset.casa;document.querySelectorAll('[data-act="casa"]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.casa===sheet.casa))}
  else if(act==='del')delSheet(a);
  else if(act==='clearEx')clearExamples();
  else if(act==='csv')exportCSV();
  else if(act==='logout')logout();
});
document.addEventListener('change',e=>{if(e.target.id==='s-ric')syncStart()});
document.addEventListener('submit',e=>{if(e.target.id==='sheetForm'){e.preventDefault();saveSheet()}else if(e.target.id==='loginForm'){e.preventDefault();doLogin()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheet)closeSheet()});

render();boot();
})();
</script>
<script>if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}</script>
